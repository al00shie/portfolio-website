# --- About ------------------------------------------------------------------
about:
  eyebrow: About
  heading: A statistician who likes to build.
  paragraphs:
    - >-
      I'm an early-career data scientist and statistician based in Portland, OR metro area.
      I hold an M.A. in Statistics from Boston University and a B.A. in Mathematics
      from Reed College.
    - >-
      My background is heavy on probability, statistical modeling, and communicating
      results, but I'm just as comfortable writing the code and building the pipeline.
      Most of what I make starts as a question and ends as something you can read,
      run, or click.

