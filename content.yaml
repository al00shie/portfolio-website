# ============================================================================
#  content.yaml — the single place to edit ALL of the site's text.
#
#  Change copy here, then run `npm run build` (or `npm run dev` to preview live).
#  Project write-ups live separately, one markdown file each, in
#  src/content/projects/*.md.
#
#  YAML tips:  • lines starting with #  are comments (ignored)
#              • the  >-  marks a block of prose you can wrap freely
#              • keep the indentation (2 spaces) as-is
# ============================================================================

# --- Identity & SEO (browser tab title, search snippet, social card, links) -
site:
  name: Ali Taqi
  initials: AT                 # the small square logo in the top-left
  title: "Ali Taqi - Portfolio"
  description: "Portfolio of Ali Taqi: Data Scientist and Statistician. Projects in Statistics and Machine Learning."
  email: alif.taqi00@gmail.com
  github: https://github.com/al00shie

# --- Top navigation links ---------------------------------------------------
nav:
  - { label: About, href: "/#about" }
  - { label: Work, href: "/#work" }
  - { label: Contact, href: "/#contact" }

# --- Hero: the big intro at the top of the homepage -------------------------
hero:
  eyebrow: ""            # small badge above the headline; leave "" to hide it
  headline: Data Scientist & Statistician
  intro: >-
    Hi! I'm Ali. I work where statistics meets software — turning messy data
    into models, and models into things you can actually use. Below are some of my 
    projects showcasing some of my undergraduate and graduate work, and beyond.

# --- Actuarial exam badges (under the hero) ---------------------------------
#  passed: true  → shows a checkmark.   passed: false → shows a dot.
#  note: the status text shown after the name (e.g. "Passed" or a date).
exams:
  - { name: Exam P,  note: Passed • Mar 2026,   passed: true }
  - { name: Exam FM, note: Passed • Feb 2026,   passed: true }

